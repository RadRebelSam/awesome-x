name: Publish landing page

# The project's own marketing page, served from landing/. Forks of this
# template inherit the file but not the repository name, so the job below skips
# itself there; a fork publishes its generated list with pages.yml instead.
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'RadRebelSam/awesome-x'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deploy
        uses: actions/deploy-pages@v4
