name: Update index

on:
  # Uncomment once your topic config is yours and a manual run looks right.
  # Until then the job only runs when you ask it to, so a fork cannot commit a
  # directory built from the example config.
  # schedule:
  #   - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-fetch every README instead of using the cache'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      # Which topic config under topics/ this repository maintains.
      TOPIC: example
      # Set whichever one provider you use; the judge picks it up on its own.
      # A step-level `if` cannot read `secrets`, so they are lifted to the job.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover and score candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/fetch.js ${{ inputs.force && '--force' || '' }}

      - name: Judge new candidates
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' || env.AI_GATEWAY_API_KEY != '' || env.TYPESAFE_API_KEY != '' }}
        run: |
          node tools/triage.js
          node tools/triage-merge.js
          node tools/rescore.js

      - name: Refresh stars and push dates for tracked entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/refresh.js

      - name: Check which entries other directories already list
        run: node tools/check-coverage.js

      - name: Render README and site
        run: |
          node tools/render.js
          node tools/build-site.js

      - name: Commit
        id: commit
        run: |
          git config user.name 'awesome-x bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing changed'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh index ($(date -u +%Y-%m-%d))"
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  # A push made with GITHUB_TOKEN does not start another workflow, so the site
  # deploy has to be chained here rather than left to the push trigger.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
