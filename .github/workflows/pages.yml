name: Publish directory site

on:
  # Uncomment after you enable Pages: repository Settings > Pages > Source:
  # GitHub Actions. Until then any deploy fails with "Get Pages site failed",
  # because there is no Pages site to deploy to yet.
  # push:
  #   branches: [main]
  #   paths:
  #     - 'site/**'
  #     - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
